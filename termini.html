e modifier les présentes Conditions à tout moment. Les modifications seront publiées sur cette page avec indication de la date de dernière mise à jour.</p>", "s8": "<h2>8. Droit applicable et juridiction compétente</h2><p>Les présentes Conditions sont régies par le droit italien. Tout litige relatif à l'interprétation, la validité ou l'exécution des présentes Conditions relèvera de la compétence exclusive du Tribunal de Milan, sauf disposition légale impérative contraire relative à la protection des consommateurs.</p>", "s9": "<h2>9. Contact</h2><p>Pour toute question relative aux présentes Conditions : <a href=\"mailto:info@likeapro.fun\">info@likeapro.fun</a></p>", "back_link": "← Retour au site", "footer_home": "Accueil", "footer_privacy": "Confidentialité", "footer_app": "App"}, "de": {"title": "Allgemeine Geschäftsbedingungen", "updated": "Letzte Aktualisierung: 30. Juli 2026", "intro": "<p>Diese Allgemeinen Geschäftsbedingungen (\"AGB\") regeln den Zugang zu und die Nutzung der Website <strong>www.likeapro.fun</strong> (die \"Website\"), betrieben von Like A Pro S.r.l. Durch das Browsen der Website akzeptiert der Nutzer diese AGB vollumfänglich. Diese AGB betreffen ausschließlich die Nutzung der Website als informative Landingpage: Die Nutzung der Like a Pro App unterliegt separaten Nutzungsbedingungen, die in der App verfügbar sind.</p>", "s1": "<h2>1. Wer wir sind</h2><p><strong>Like A Pro S.r.l.</strong>, ein innovatives Startup mit Sitz in Viale Angelo Filippetti 26, 20122 Mailand (MI), Italien — USt-IdNr. 14837890962, SDI-Code USAL8PV.</p>", "s2": "<h2>2. Was die Website ist</h2><p>Die Website ist eine informative Landingpage, die Like a Pro vorstellt, eine soziale App für Sporttipps. Gruppen von Nutzern erstellen private oder öffentliche Ligen und treten gegeneinander an, indem sie Sportereignisse vorhersagen, mit automatischer Punktevergabe, Ranglisten und nicht-monetären Preisen.</p><p>Die Website <strong>verarbeitet keine Zahlungen, keine Registrierun tand</h2><p>Diese AGB unterliegen italienischem Recht. Für Streitigkeiten bezüglich der Auslegung, Gültigkeit oder Erfüllung dieser AGB ist ausschließlich das Gericht Mailand zuständig, sofern nicht zwingende gesetzliche Bestimmungen zum Verbraucherschutz etwas anderes vorsehen.</p>", "s9": "<h2>9. Kontakt</h2><p>Für Fragen zu diesen AGB: <a href=\"mailto:info@likeapro.fun\">info@likeapro.fun</a></p>", "back_link": "← Zurück zur Website", "footer_home": "Startseite", "footer_privacy": "Datenschutz", "footer_app": "App"}, "pt": {"title": "Termos e Condições", "updated": "Última atualização: 30 de julho de 2026", "intro": "<p>Estes Termos e Condições (\"Termos\") regulam o acesso e a utilização do site <strong>www.likeapro.fun</strong> (o \"Site\"), gerido pela Like A Pro S.r.l. Ao navegar no Site, o utilizador aceita integralmente estes Termos. Estes Termos abrangem exclusivamente o uso do Site como landing page informativa: o uso da app Like a Pro é regulado por termos de serviço separados, disponíveis dentro da app.</p>", "s1": "<h2>1. Quem somos</h2><p><strong>Like A Pro S.r.l.</strong>, startup inovadora com sede em Viale Angelo Filippetti 26, 20122 Milão (MI), Itália — NIF/IVA 14837890962, Código SDI USAL8PV.</p>", "s2": "<h2>2. O que é o Site</h2><p>O Site é uma landing page informativa que apresenta a Like a Pro, uma app social de prognósticos desportivos. Grupos de utilizadores criam ligas privadas ou públicas e competem prevendo eventos desportivos, com atribuição automática de pontuações, classificações e prémios não monetários.</p><p>O Site <strong>não processa pagamentos, não trata registos nem aloja a experiência de jogo</strong>: estas funcionalidades estão disponíveis exclusivamente dentro da app, descarregável através dos links no Site.</p>", "s3": "<h2>3. Natureza do serviço</h2><p>A Like a Pro é um serviço de prognósticos desportivos entre amigos, com fins lúdicos e sociais. O serviço não envolve a recolha de apostas nem o pagamento de prémios em dinheiro real: quaisquer prémios (emblemas, pontos, reconhecimentos, prémios de patrocinadores sobre estatísticas específicas) não estão de forma alguma associados a somas de dinheiro depositadas pelo utilizador.</p>", "s4": "<h2>4. Propriedade intelectual</h2><p>O nome \"Like a Pro\", o logótipo, o slogan \"Join. Predict. Win.\" e todo o conteúdo presente no Site (textos, gráficos, imagens) são propriedade da Like A Pro S.r.l. ou estão licenciados à mesma, sendo protegidos pela legislação aplicável em matéria de propriedade intelectual. É proibida a reprodução, distribuição ou modificação dos conteúdos do Site sem autorização prévia por escrito.</p>", "s5": "<h2>5. Links para sites e serviços de terceiros</h2><p>O Site contém links para serviços de terceiros (Instagram, App Store, Google Play). A Like A Pro S.r.l. não é responsável pelo conteúdo ou pelas práticas de privacidade de tais serviços, regidos pelos respetivos termos e condições.</p>", "s6": "<h2>6. Limitação de responsabilidade</h2><p>O Site é fornecido \"tal como está\". A Like A Pro S.r.l. procura manter as informações atualizadas e precisas, mas não garante a ausência de erros, interrupções ou imprecisões. Nos limites permitidos por lei, a Like A Pro S.r.l. não é responsável por quaisquer danos diretos ou indiretos decorrentes do uso ou da impossibilidade de uso do Site.</p>", "s7": "<h2>7. Alterações a estes Termos</h2><p>A Like A Pro S.r.l. reserva-se o direito de alterar estes Termos a qualquer momento. As alterações serão publicadas nesta página com indicação da data da última atualização.</p>", "s8": "<h2>8. Lei aplicável e foro competente</h2><p>Estes Termos regem-se pela lei italiana. Qualquer litígio relativo à interpretação, validade ou execução destes Termos será da competência exclusiva do Tribunal de Milão, salvo disposição legal imperativa diversa em matéria de proteção do consumidor.</p>", "s9": "<h2>9. Contacto</h2><p>Para qualquer questão relativa a estes Termos: <a href=\"mailto:info@likeapro.fun\">info@likeapro.fun</a></p>", "back_link": "← Voltar ao site", "footer_home": "Início", "footer_privacy": "Privacidade", "footer_app": "App"}, "zh": {"title": "条款与条件", "updated": "最后更新：2026年7月30日", "intro": "<p>本条款与条件（\"条款\"）规范对网站 <strong>www.likeapro.fun</strong>（\"本网站\"）的访问和使用，本网站由 Like A Pro S.r.l. 运营。浏览本网站即表示用户完全接受本条款。本条款仅适用于将本网站作为信息性着陆页使用：使用 Like a Pro 应用程序须遵守应用内提供的单独服务条款。</p>", "s1": "<h2>1. 关于我们</h2><p><strong>Like A Pro S.r.l.</strong>，一家创新型初创公司，注册地址为 Viale Angelo Filippetti 26, 20122 米兰（MI），意大利 — 增值税号 14837890962，SDI 代码 USAL8PV。</p>", "s2": "<h2>2. 本网站是什么</h2><p>本网站是一个信息性着陆页，介绍 Like a Pro——一款社交体育预测应用。用户群体创建私人或公开联赛，通过预测体育赛事进行竞争，系统自动计分、生成排行榜并颁发非货币性奖励。</p><p>本网站<strong>不处理支付、不处理注册，也不承载游戏体验</strong>：这些功能仅在应用内提供，可通过本网站上的链接下载该应用。</p>", "s3": "<h2>3. 服务性质</h2><p>Like a Pro 是朋友之间的体育预测服务，具有娱乐和社交性质。该服务不涉及收取赌注，也不支付真实货币奖金：任何奖励（徽章、积分、荣誉、针对特定统计数据的赞助商奖励）均与用户存入的任何款项无关。</p>", "s4": "<h2>4. 知识产权</h2><p>\"Like a Pro\" 名称、标志、标语\"Join. Predict. Win.\"以及网站上的所有内容（文本、图形、图像）均为 Like A Pro S.r.l. 所有或已获得其授权许可，并受适用知识产权法律的保护。未经事先书面授权，禁止复制、分发或修改本网站内容。</p>", "s5": "<h2>5. 第三方网站及服务链接</h2><p>本网站包含指向第三方服务的链接（Instagram、App Store、Google Play）。Like A Pro S.r.l. 对此类服务的内容或隐私实践不承担责任，这些服务受其各自的条款和条件约束。</p>", "s6": "<h2>6. 责任限制</h2><p>本网站按\"现状\"提供。Like A Pro S.r.l. 致力于保持信息的更新和准确，但不保证不存在错误、中断或不准确之处。在法律允许的范围内，Like A Pro S.r.l. 对因使用或无法使用本网站而产生的任何直接或间接损害不承担责任。</p>", "s7": "<h2>7. 本条款的变更</h2><p>Like A Pro S.r.l. 保留随时修改本条款的权利。变更将在本页面公布，并标明最后更新日期。</p>", "s8": "<h2>8. 适用法律与管辖权</h2><p>本条款受意大利法律管辖。有关本条款的解释、有效性或履行的任何争议均应由米兰法院专属管辖，除非涉及消费者保护的强制性法律另有规定。</p>", "s9": "<h2>9. 联系方式</h2><p>如对本条款有任何疑问，请联系：<a href=\"mailto:info@likeapro.fun\">info@likeapro.fun</a></p>", "back_link": "← 返回网站", "footer_home": "首页", "footer_privacy": "隐私政策", "footer_app": "应用"}, "ja": {"title": "利用規約", "updated": "最終更新日：2026年7月30日", "intro": "<p>本利用規約（「本規約」）は、Like A Pro S.r.l. が運営するウェブサイト <strong>www.likeapro.fun</strong>（「本サイト」）へのアクセスおよび利用について定めるものです。本サイトを閲覧することにより、利用者は本規約に完全に同意したものとみなされます。本規約は、情報提供用ランディングページとしての本サイトの利用にのみ適用されます。Like a Pro アプリの利用については、アプリ内に用意された別の利用規約が適用されます。</p>", "s1": "<h2>1. 運営者について</h2><p><strong>Like A Pro S.r.l.</strong>、革新的スタートアップ企業、登記住所 Viale Angelo Filippetti 26, 20122 ミラノ（MI）、イタリア — VAT/税務ID 14837890962、SDIコード USAL8PV。</p>", "s2": "<h2>2. 本サイトについて</h2><p>本サイトは、ソーシャルスポーツ予想アプリ Like a Pro を紹介する情報提供用ランディングページです。ユーザーグループはプライベートまたはパブリックのリーグを作成し、スポーツイベントを予想して競い合い、自動的にスコアが計算され、ランキングと非金銭的な賞が付与されます。</p><p>本サイトは<strong>決済処理、登録処理、ゲームプレイ体験の提供は一切行いません</strong>。これらの機能は、本サイト上のリンクからダウンロードできるアプリ内でのみ利用可能です。</p>", "s3": "<h2>3. サービスの性質</h2><p>Like a Proは、娯楽および社交を目的とした友人間のスポーツ予想サービスです。本サービスには賭け金の徴収や実際の金銭による賞金の支払いは一切含まれません。付与される可能性のある賞品（バッジ、ポイント、称号、特定の統計データに基づくスポンサー賞品）は、利用者が入金した金額とは一切関係ありません。</p>", "s4": "<h2>4. 知的財産権</h2><p>「Like a Pro」の名称、ロゴ、タグライン「Join. Predict. Win.」、および本サイト上のすべてのコンテンツ（テキスト、グラフィック、画像）は、Like A Pro S.r.l. が所有するか、同社にライセンスされたものであり、適用される知的財産法により保護されています。事前の書面による許可なく、本サイトのコンテンツを複製、配布、または改変することは禁止されています。</p>", "s5": "<h2>5. 第三者のサイトおよびサービスへのリンク</h2><p>本サイトには、第三者サービス（Instagram、App Store、Google Play）へのリンクが含まれています。Like A Pro S.r.l. は、これらのサービスの内容やプライバシー慣行について責任を負いません。それらは各サービス独自の利用規約に従います。</p>", "s6": "<h2>6. 責任の制限</h2><p>本サイトは「現状のまま」提供されます。Like A Pro S.r.l. は情報を最新かつ正確に保つよう努めますが、誤り、中断、不正確さがないことを保証するものではありません。法律で認められる範囲において、Like A Pro S.r.l. は本サイトの利用または利用不能から生じる直接的または間接的な損害について責任を負いません。</p>", "s7": "<h2>7. 本規約の変更</h2><p>Like A Pro S.r.l. は、いつでも本規約を変更する権利を留保します。変更は本ページに最終更新日とともに掲載されます。</p>", "s8": "<h2>8. 準拠法および管轄裁判所</h2><p>本規約はイタリア法に準拠します。本規約の解釈、有効性、履行に関する紛争については、消費者保護に関する強行法規に別段の定めがない限り、ミラノ裁判所を専属的管轄裁判所とします。</p>", "s9": "<h2>9. お問い合わせ</h2><p>本規約に関するご質問は <a href=\"mailto:info@likeapro.fun\">info@likeapro.fun</a> までご連絡ください。</p>", "back_link": "← サイトに戻る", "footer_home": "ホーム", "footer_privacy": "プライバシー", "footer_app": "アプリ"}, "ar": {"title": "الشروط والأحكام", "updated": "آخر تحديث: 30 يوليو 2026", "intro": "<p>تحكم هذه الشروط والأحكام (\"الشروط\") الوصول إلى واستخدام موقع <strong>www.likeapro.fun</strong> (\"الموقع\")، الذي تديره شركة Like A Pro S.r.l. من خلال تصفح الموقع، يوافق المستخدم بشكل كامل على هذه الشروط. تغطي هذه الشروط حصرياً استخدام الموقع كصفحة هبوط معلوماتية: يخضع استخدام تطبيق Like a Pro لشروط خدمة منفصلة متاحة داخل التطبيق.</p>", "s1": "<h2>1. من نحن</h2><p><strong>Like A Pro S.r.l.</strong>، شركة ناشئة مبتكرة يقع مقرها المسجل في Viale Angelo Filippetti 26, 20122 ميلانو (MI)، إيطاليا — الرقم الضريبي 14837890962، رمز SDI USAL8PV.</p>", "s2": "<h2>2. ما هو الموقع</h2><p>الموقع هو صفحة هبوط معلوماتية تقدّم Like a Pro، تطبيق اجتماعي للتوقعات الرياضية. تُنشئ مجموعات المستخدمين دوريات خاصة أو عامة وتتنافس من خلال توقّع الأحداث الرياضية، مع احتساب تلقائي للنقاط وترتيب تصنيفي وجوائز غير نقدية.</p><p>الموقع <strong>لا يعالج المدفوعات، ولا يتعامل مع التسجيلات، ولا يستضيف تجربة اللعب</strong>: هذه الميزات متاحة حصرياً داخل التطبيق، الذي يمكن تنزيله عبر الروابط الموجودة على الموقع.</p>", "s3": "<h2>3. طبيعة الخدمة</h2><p>Like a Pro هي خدمة توقعات رياضية بين الأصدقاء، لأغراض ترفيهية واجتماعية. لا تتضمن الخدمة جمع رهانات أو دفع أرباح نقدية حقيقية: أي جوائز (شارات، نقاط، تكريمات، جوائز من رعاة مرتبطة بإحصائيات معينة) لا ترتبط بأي شكل من الأشكال بمبالغ مالية يودعها المستخدم.</p>", "s4": "<h2>4. الملكية الفكرية</h2><p>اسم \"Like a Pro\"، والشعار، وعبارة \"Join. Predict. Win.\"، وجميع المحتويات الموجودة على الموقع (نصوص، رسومات، صور) مملوكة لشركة Like A Pro S.r.l. أو مرخصة لها، ومحمية بموجب قوانين الملكية الفكرية المعمول بها. يُحظر نسخ محتوى الموقع أو توزيعه أو تعديله دون إذن كتابي مسبق.</p>", "s5": "<h2>5. روابط لمواقع وخدمات أطراف ثالثة</h2><p>يحتوي الموقع على روابط لخدمات أطراف ثالثة (إنستغرام، App Store، Google Play). لا تتحمل Like A Pro S.r.l. مسؤولية محتوى أو ممارسات الخصوصية الخاصة بهذه الخدمات، والتي تخضع لشروطها وأحكامها الخاصة.</p>", "s6": "<h2>6. تحديد المسؤولية</h2><p>يُقدَّم الموقع \"كما هو\". تسعى Like A Pro S.r.l. للحفاظ على معلومات محدّثة ودقيقة، لكنها لا تضمن خلوها من الأخطاء أو الانقطاعات أو عدم الدقة. في الحدود التي يسمح بها القانون، لا تتحمل Like A Pro S.r.l. مسؤولية أي أضرار مباشرة أو غير مباشرة ناجمة عن استخدام الموقع أو عدم القدرة على استخدامه.</p>", "s7": "<h2>7. تعديلات هذه الشروط</h2><p>تحتفظ Like A Pro S.r.l. بالحق في تعديل هذه الشروط في أي وقت. سيتم نشر التعديلات في هذه الصفحة مع الإشارة إلى تاريخ آخر تحديث.</p>", "s8": "<h2>8. القانون المعمول به والاختصاص القضائي</h2><p>تخضع هذه الشروط للقانون الإيطالي. أي نزاع يتعلق بتفسير هذه الشروط أو صحتها أو تنفيذها يخضع للاختصاص الحصري لمحكمة ميلانو، ما لم تنص أحكام قانونية إلزامية أخرى على خلاف ذلك لحماية المستهلك.</p>", "s9": "<h2>9. التواصل</h2><p>لأي استفسار بخصوص هذه الشروط: <a href=\"mailto:info@likeapro.fun\">info@likeapro.fun</a></p>", "back_link": "← العودة إلى الموقع", "footer_home": "الرئيسية", "footer_privacy": "الخصوصية", "footer_app": "التطبيق"}, "hi": {"title": "नियम व शर्तें", "updated": "आख़िरी अपडेट: 30 जुलाई 2026", "intro": "<p>ये नियम व शर्तें (\"शर्तें\") वेबसाइट <strong>www.likeapro.fun</strong> (\"साइट\") तक पहुंच और उसके इस्तेमाल को नियंत्रित करती हैं, जिसे Like A Pro S.r.l. संचालित करती है। साइट ब्राउज़ करके, यूज़र इन शर्तों को पूरी तरह स्वीकार करता है। ये शर्तें सिर्फ़ साइट के इनफॉर्मेशनल लैंडिंग पेज के रूप में इस्तेमाल पर लागू होती हैं: Like a Pro ऐप के इस्तेमाल के लिए ऐप के अंदर उपलब्ध अलग सर्विस टर्म्स लागू होते हैं।</p>", "s1": "<h2>1. हम कौन हैं</h2><p><strong>Like A Pro S.r.l.</strong>, एक इनोवेटिव स्टार्टअप, जिसका रजिस्टर्ड ऑफिस Viale Angelo Filippetti 26, 20122 मिलान (MI), इटली में है — VAT/टैक्स ID 14837890962, SDI कोड USAL8PV।</p>", "s2": "<h2>2. साइट क्या है</h2><p>साइट एक इनफॉर्मेशनल लैंडिंग पेज है जो Like a Pro को पेश करती है, जो एक सोशल स्पोर्ट्स प्रेडिक्शन ऐप है। यूज़र्स के ग्रुप प्राइवेट या पब्लिक लीग बनाते हैं और स्पोर्ट्स इवेंट्स का अनुमान लगाकर मुक़ाबला करते हैं, जिसमें ऑटोमैटिक स्कोरिंग, लीडरबोर्ड और गैर-मौद्रिक इनाम होते हैं।</p><p>साइट <strong>कोई पेमेंट प्रोसेस नहीं करती, कोई रजिस्ट्रेशन हैंडल नहीं करती और गेमप्ले एक्सपीरियंस होस्ट नहीं करती</strong>: ये फ़ीचर्स सिर्फ़ ऐप के अंदर उपलब्ध हैं, जिसे साइट पर मौजूद लिंक्स के ज़रिए डाउनलोड किया जा सकता है।</p>", "s3": "<h2>3. सर्विस की प्रकृति</h2><p>Like a Pro दोस्तों के बीच एक स्पोर्ट्स प्रेडिक्शन सर्विस है, जिसका मक़सद मनोरंजन और सामाजिक जुड़ाव है। इस सर्विस में कोई पैसे की शर्त लगाना शामिल नहीं है, न ही असली पैसे में इनाम दिया जाता है: कोई भी इनाम (बैज, पॉइंट्स, सम्मान, स्पेसिफिक स्टैट्स पर स्पॉन्सर इनाम) किसी भी तरह से यूज़र द्वारा जमा की गई किसी भी राशि से जुड़ा नहीं है।</p>", "s4": "<h2>4. इंटेलेक्चुअल प्रॉपर्टी</h2><p>\"Like a Pro\" नाम, लोगो, टैगलाइन \"Join. Predict. Win.\" और साइट पर मौजूद सभी कंटेंट (टेक्स्ट, ग्राफ़िक्स, इमेजेज़) या तो Like A Pro S.r.l. की प्रॉपर्टी हैं या उसे लाइसेंस प्राप्त हैं, और लागू इंटेलेक्चुअल प्रॉपर्टी क़ानून के तहत सुरक्षित हैं। बिना पूर्व लिखित अनुमति के साइट के कंटेंट की नक़ल, वितरण या बदलाव करना मना है।</p>", "s5": "<h2>5. थर्ड-पार्टी साइट्स और सर्विसेज़ के लिंक</h2><p>साइट में थर्ड-पार्टी सर्विसेज़ (Instagram, App Store, Google Play) के लिंक शामिल हैं। Like A Pro S.r.l. ऐसी सर्विसेज़ के कंटेंट या प्राइवेसी प्रैक्टिसेज़ के लिए ज़िम्मेदार नहीं है, जो अपनी-अपनी शर्तों से गवर्न होती हैं।</p>", "s6": "<h2>6. दायित्व की सीमा</h2><p>साइट \"जैसी है वैसी\" उपलब्ध कराई जाती है। Like A Pro S.r.l. जानकारी को अपडेटेड और सटीक रखने की कोशिश करती है, लेकिन ग़लतियों, रुकावटों या अशुद्धियों की अनुपस्थिति की गारंटी नहीं देती। क़ानून द्वारा अनुमत सीमा तक, Like A Pro S.r.l. साइट के इस्तेमाल या इस्तेमाल न कर पाने से होने वाले किसी भी प्रत्यक्ष या अप्रत्यक्ष नुक़सान के लिए ज़िम्मेदार नहीं है।</p>", "s7": "<h2>7. इन शर्तों में बदलाव</h2><p>Like A Pro S.r.l. के पास इन शर्तों को कभी भी बदलने का अधिकार सुरक्षित है। बदलाव आख़िरी अपडेट की तारीख़ के साथ इसी पेज पर पब्लिश किए जाएंगे।</p>", "s8": "<h2>8. लागू क़ानून और क्षेत्राधिकार</h2><p>ये शर्तें इटैलियन क़ानून के तहत गवर्न होती हैं। इन शर्तों की व्याख्या, वैधता या पालन से जुड़े किसी भी विवाद पर, उपभोक्ता संरक्षण से जुड़े किसी अनिवार्य क़ानूनी प्रावधान के अलावा, सिर्फ़ मिलान कोर्ट का एकमात्र अधिकार क्षेत्र होगा।</p>", "s9": "<h2>9. संपर्क</h2><p>इन शर्तों से जुड़े किसी भी सवाल के लिए: <a href=\"mailto:info@likeapro.fun\">info@likeapro.fun</a></p>", "back_link": "← साइट पर वापस जाएं", "footer_home": "होम", "footer_privacy": "प्राइवेसी", "footer_app": "ऐप"}, "ru": {"title": "Условия использования", "updated": "Последнее обновление: 30 июля 2026 г.", "intro": "<p>Настоящие Условия использования (\"Условия\") регулируют доступ к сайту <strong>www.likeapro.fun</strong> (\"Сайт\") и его использование; сайт управляется Like A Pro S.r.l. Просматривая Сайт, пользователь полностью принимает настоящие Условия. Данные Условия касаются исключительно использования Сайта как информационной целевой страницы: использование приложения Like a Pro регулируется отдельными условиями обслуживания, доступными внутри приложения.</p>", "s1": "<h2>1. Кто мы</h2><p><strong>Like A Pro S.r.l.</strong>, инновационный стартап с юридическим адресом Viale Angelo Filippetti 26, 20122 Милан (MI), Италия — VAT/налоговый номер 14837890962, Код SDI USAL8PV.</p>", "s2": "<h2>2. Что такое Сайт</h2><p>Сайт представляет собой информационную целевую страницу, представляющую Like a Pro — социальное приложение для спортивных прогнозов. Группы пользователей создают частные или публичные лиги и соревнуются, прогнозируя спортивные события, с автоматическим начислением очков, рейтингами и неденежными призами.</p><p>Сайт <strong>не обрабатывает платежи, не выполняет регистрацию и не размещает игровой процесс</strong>: эти функции доступны исключительно внутри приложения, которое можно скачать по ссылкам на Сайте.</p>", "s3": "<h2>3. Характер сервиса</h2><p>Like a Pro — это сервис спортивных прогнозов между друзьями, предназначенный для развлечения и общения. Сервис не предполагает сбор ставок или выплату реальных денежных выигрышей: любые призы (значки, очки, награды, призы от спонсоров за определённую статистику) никак не связаны с денежными суммами, внесёнными пользователем.</p>", "s4": "<h2>4. Интеллектуальная собственность</h2><p>Название \"Like a Pro\", логотип, слоган \"Join. Predict. Win.\" и всё содержимое Сайта (тексты, графика, изображения) принадлежат Like A Pro S.r.l. или используются по лицензии и защищены действующим законодательством об интеллектуальной собственности. Воспроизведение, распространение или изменение содержимого Сайта без предварительного письменного разрешения запрещены.</p>", "s5": "<h2>5. Ссылки на сторонние сайты и сервисы</h2><p>Сайт содержит ссылки на сторонние сервисы (Instagram, App Store, Google Play). Like A Pro S.r.l. не несёт ответственности за содержание или практику конфиденциальности таких сервисов, которые регулируются их собственными условиями использования.</p>", "s6": "<h2>6. Ограничение ответственности</h2><p>Сайт предоставляется \"как есть\". Like A Pro S.r.l. стремится поддерживать информацию актуальной и точной, но не гарантирует отсутствия ошибок, перебоев или неточностей. В пределах, допустимых законом, Like A Pro S.r.l. не несёт ответственности за любые прямые или косвенные убытки, возникшие в результате использования Сайта или невозможности его использования.</p>", "s7": "<h2>7. Изменения настоящих Условий</h2><p>Like A Pro S.r.l. оставляет за собой право изменять настоящие Условия в любое время. Изменения будут опубликованы на этой странице с указанием даты последнего обновления.</p>", "s8": "<h2>8. Применимое право и юрисдикция</h2><p>Настоящие Условия регулируются законодательством Италии. Любые споры относительно толкования, действительности или исполнения настоящих Условий подлежат исключительной юрисдикции суда города Милан, если иное не предусмотрено императивными нормами закона о защите прав потребителей.</p>", "s9": "<h2>9. Контакты</h2><p>По любым вопросам, связанным с настоящими Условиями: <a href=\"mailto:info@likeapro.fun\">info@likeapro.fun</a></p>", "back_link": "← Вернуться на сайт", "footer_home": "Главная", "footer_privacy": "Конфиденциальность", "footer_app": "Приложение"}, "pl": {"title": "Regulamin", "updated": "Ostatnia aktualizacja: 30 lipca 2026", "intro": "<p>Niniejszy Regulamin (\"Regulamin\") określa zasady dostępu i korzystania ze strony <strong>www.likeapro.fun</strong> (\"Strona\"), prowadzonej przez Like A Pro S.r.l. Przeglądając Stronę, użytkownik w pełni akceptuje niniejszy Regulamin. Niniejszy Regulamin dotyczy wyłącznie korzystania ze Strony jako informacyjnej landing page: korzystanie z aplikacji Like a Pro podlega odrębnym warunkom świadczenia usług, dostępnym w aplikacji.</p>", "s1": "<h2>1. Kim jesteśmy</h2><p><strong>Like A Pro S.r.l.</strong>, innowacyjny startup z siedzibą przy Viale Angelo Filippetti 26, 20122 Mediolan (MI), Włochy — NIP/VAT 14837890962, Kod SDI USAL8PV.</p>", "s2": "<h2>2. Czym jest Strona</h2><p>Strona jest informacyjną landing page prezentującą Like a Pro, społecznościową aplikację do typowania wyników sportowych. Grupy użytkowników tworzą ligi prywatne lub publiczne i rywalizują, typując wydarzenia sportowe, z automatycznym naliczaniem punktów, rankingami i nagrodami niepieniężnymi.</p><p>Strona <strong>nie przetwarza płatności, nie obsługuje rejestracji ani nie hostuje rozgrywki</strong>: te funkcje są dostępne wyłącznie w aplikacji, do pobrania za pomocą linków znajdujących się na Stronie.</p>", "s3": "<h2>3. Charakter usługi</h2><p>Like a Pro to usługa typowania wyników sportowych wśród znajomych, o charakterze rozrywkowym i towarzyskim. Usługa nie obejmuje zbierania stawek ani wypłacania rzeczywistych wygranych pieniężnych: ewentualne nagrody (odznaki, punkty, wyróżnienia, nagrody sponsorów za konkretne statystyki) w żaden sposób nie są powiązane z sumami pieniędzy wpłaconymi przez użytkownika.</p>", "s4": "<h2>4. Własność intelektualna</h2><p>Nazwa \"Like a Pro\", logo, hasło \"Join. Predict. Win.\" oraz wszystkie treści na Stronie (teksty, grafiki, obrazy) są własnością Like A Pro S.r.l. lub są jej licencjonowane i podlegają ochronie na mocy obowiązujących przepisów o własności intelektualnej. Zabrania się powielania, rozpowszechniania lub modyfikowania treści Strony bez uprzedniej pisemnej zgody.</p>", "s5": "<h2>5. Linki do stron i usług osób trzecich</h2><p>Strona zawiera linki do usług osób trzecich (Instagram, App Store, Google Play). Like A Pro S.r.l. nie ponosi odpowiedzialności za treść ani praktyki w zakresie prywatności takich usług, które podlegają ich własnym regulaminom.</p>", "s6": "<h2>6. Ograniczenie odpowiedzialności</h2><p>Strona jest dostarczana \"tak jak jest\". Like A Pro S.r.l. dokłada starań, aby informacje były aktualne i dokładne, ale nie gwarantuje braku błędów, przerw czy nieścisłości. W zakresie dozwolonym przez prawo, Like A Pro S.r.l. nie ponosi odpowiedzialności za jakiekolwiek bezpośrednie lub pośrednie szkody wynikające z korzystania lub niemożności korzystania ze Strony.</p>", "s7": "<h2>7. Zmiany niniejszego Regulaminu</h2><p>Like A Pro S.r.l. zastrzega sobie prawo do zmiany niniejszego Regulaminu w dowolnym momencie. Zmiany będą publikowane na tej stronie wraz ze wskazaniem daty ostatniej aktualizacji.</p>", "s8": "<h2>8. Prawo właściwe i jurysdykcja</h2><p>Niniejszy Regulamin podlega prawu włoskiemu. Wszelkie spory dotyczące interpretacji, ważności lub wykonania niniejszego Regulaminu podlegają wyłącznej jurysdykcji Sądu w Mediolanie, chyba że bezwzględnie obowiązujące przepisy prawa dotyczące ochrony konsumentów stanowią inaczej.</p>", "s9": "<h2>9. Kontakt</h2><p>W sprawie pytań dotyczących niniejszego Regulaminu: <a href=\"mailto:info@likeapro.fun\">info@likeapro.fun</a></p>", "back_link": "← Powrót do strony", "footer_home": "Strona główna", "footer_privacy": "Prywatność", "footer_app": "Aplikacja"}, "sr": {"title": "Uslovi korišćenja", "updated": "Poslednje ažuriranje: 30. jul 2026.", "intro": "<p>Ovi Uslovi korišćenja (\"Uslovi\") regulišu pristup i korišćenje sajta <strong>www.likeapro.fun</strong> (\"Sajt\"), kojim upravlja Like A Pro S.r.l. Pregledanjem Sajta, korisnik u potpunosti prihvata ove Uslove. Ovi Uslovi se odnose isključivo na korišćenje Sajta kao informativne landing stranice: korišćenje Like a Pro aplikacije regulisano je posebnim uslovima korišćenja, dostupnim unutar aplikacije.</p>", "s1": "<h2>1. Ko smo mi</h2><p><strong>Like A Pro S.r.l.</strong>, inovativna startap kompanija sa sedištem na adresi Viale Angelo Filippetti 26, 20122 Milano (MI), Italija — PDV broj 14837890962, SDI kod USAL8PV.</p>", "s2": "<h2>2. Šta je Sajt</h2><p>Sajt je informativna landing stranica koja predstavlja Like a Pro, društvenu aplikaciju za sportska predviđanja. Grupe korisnika kreiraju privatne ili javne lige i takmiče se predviđajući sportske događaje, uz automatsko bodovanje, rang-liste i nenovčane nagrade.</p><p>Sajt <strong>ne obrađuje plaćanja, ne obrađuje registracije i ne hostuje iskustvo igre</strong>: ove funkcije su dostupne isključivo unutar aplikacije, koja se preuzima putem linkova na Sajtu.</p>", "s3": "<h2>3. Priroda usluge</h2><p>Like a Pro je usluga sportskih predviđanja među prijateljima, u zabavne i društvene svrhe. Usluga ne podrazumeva prikupljanje uloga niti isplatu novčanih dobitaka: bilo kakve nagrade (bedževi, poeni, priznanja, sponzorske nagrade vezane za određene statistike) ni na koji način nisu povezane sa novčanim iznosima koje je korisnik uplatio.</p>", "s4": "<h2>4. Intelektualna svojina</h2><p>Naziv \"Like a Pro\", logo, slogan \"Join. Predict. Win.\" i sav sadržaj na Sajtu (tekstovi, grafika, slike) su vlasništvo Like A Pro S.r.l. ili su joj licencirani, i zaštićeni su važećim propisima o intelektualnoj svojini. Zabranjeno je umnožavanje, distribucija ili izmena sadržaja Sajta bez prethodnog pismenog odobrenja.</p>", "s5": "<h2>5. Linkovi ka sajtovima i uslugama trećih strana</h2><p>Sajt sadrži linkove ka uslugama trećih strana (Instagram, App Store, Google Play). Like A Pro S.r.l. nije odgovorna za sadržaj ili praksu privatnosti takvih usluga, koje su regulisane njihovim sopstvenim uslovima korišćenja.</p>", "s6": "<h2>6. Ograničenje odgovornosti</h2><p>Sajt se pruža \"kakav jeste\". Like A Pro S.r.l. nastoji da informacije budu ažurne i tačne, ali ne garantuje odsustvo grešaka, prekida ili netačnosti. U meri dozvoljenoj zakonom, Like A Pro S.r.l. nije odgovorna za bilo kakvu direktnu ili indirektnu štetu nastalu usled korišćenja ili nemogućnosti korišćenja Sajta.</p>", "s7": "<h2>7. Izmene ovih Uslova</h2><p>Like A Pro S.r.l. zadržava pravo da izmeni ove Uslove u bilo kom trenutku. Izmene će biti objavljene na ovoj stranici uz naznaku datuma poslednjeg ažuriranja.</p>", "s8": "<h2>8. Merodavno pravo i nadležnost</h2><p>Ovi Uslovi se regulišu italijanskim pravom. Za bilo koji spor u vezi sa tumačenjem, važenjem ili izvršenjem ovih Uslova isključivo je nadležan Sud u Milanu, osim ako obavezujuće zakonske odredbe o zaštiti potrošača ne nalažu drugačije.</p>", "s9": "<h2>9. Kontakt</h2><p>Za sva pitanja u vezi sa ovim Uslovima: <a href=\"mailto:info@likeapro.fun\">info@likeapro.fun</a></p>", "back_link": "← Nazad na sajt", "footer_home": "Početna", "footer_privacy": "Privatnost", "footer_app": "Aplikacija"}};
  const LANGS = [["it", "🇮🇹", "Italiano"], ["en", "🇬🇧", "English"], ["es", "🇪🇸", "Español"], ["fr", "🇫🇷", "Français"], ["de", "🇩🇪", "Deutsch"], ["pt", "🇵🇹", "Português"], ["zh", "🇨🇳", "中文"], ["ja", "🇯🇵", "日本語"], ["ar", "🇸🇦", "العربية"], ["hi", "🇮🇳", "हिन्दी"], ["ru", "🇷🇺", "Русский"], ["pl", "🇵🇱", "Polski"], ["sr", "🇷🇸", "Srpski"]];
  const RTL = ["ar"];

  const langMenu = document.getElementById('langMenu');
  const langBtn = document.getElementById('langBtn');
  const langFlagCurrent = document.getElementById('langFlagCurrent');
  const htmlRoot = document.getElementById('htmlRoot');

  function buildMenu(active){
    langMenu.innerHTML = '';
    LANGS.forEach(([code, flag, label]) => {
      const item = document.createElement('div');
      item.className = 'lang-item' + (code === active ? ' active' : '');
      item.setAttribute('role','option');
      item.innerHTML = '<span class="lang-flag">' + flag + '</span><span>' + label + '</span>';
      item.addEventListener('click', () => { setLang(code); langMenu.classList.remove('open'); });
      langMenu.appendChild(item);
    });
  }

  function setLang(code){
    if(!I18N[code]) code = 'it';
    const dict = I18N[code];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(dict[key] !== undefined) el.innerHTML = dict[key];
    });
    const isRTL = RTL.includes(code);
    htmlRoot.setAttribute('lang', code);
    htmlRoot.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
    const flagEntry = LANGS.find(l => l[0] === code);
    langFlagCurrent.textContent = flagEntry ? flagEntry[1] : '🇮🇹';
    buildMenu(code);
    try{ localStorage.setItem('lapro_lang', code); }catch(e){}
    const suffix = code === 'it' ? '' : ('?lang=' + code);
    document.getElementById('backLink').href = 'index.html' + suffix;
    document.getElementById('footHomeLink').href = 'index.html' + suffix;
    document.getElementById('footPrivacyLink').href = 'privacy.html' + suffix;
  }

  function detectDefaultLang(){
    try{
      const saved = localStorage.getItem('lapro_lang');
      if(saved && I18N[saved]) return saved;
    }catch(e){}
    const params = new URLSearchParams(window.location.search);
    const fromUrl = params.get('lang');
    if(fromUrl && I18N[fromUrl]) return fromUrl;
    const nav = (navigator.language || 'it').slice(0,2).toLowerCase();
    if(I18N[nav]) return nav;
    return 'it';
  }

  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    langMenu.classList.toggle('open');
    langBtn.setAttribute('aria-expanded', langMenu.classList.contains('open'));
  });
  document.addEventListener('click', () => langMenu.classList.remove('open'));

  setLang(detectDefaultLang());
</script>
