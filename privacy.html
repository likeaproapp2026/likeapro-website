  th{color:var(--white); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:0.03em;}

ologies similaires</h3><p>Le Site utilise <strong>Google Fonts</strong> (Bebas Neue, Inter), chargées depuis les serveurs de Google pour l'affichage des polices. Cela implique la transmission de l'adresse IP du visiteur à Google LLC (États-Unis), sur la base des clauses contractuelles types adoptées par Google pour les transferts hors UE.</p><p>Le Site n'utilise actuellement aucun cookie de profilage, marketing ou d'analyse tiers. Si des outils d'analyse ou de marketing sont introduits à l'avenir, cette notice et la bannière cookies correspondante seront mises à jour, avec demande de consentement lorsque requis par la loi.</p>", "s3": "<h2>3. Finalités et base juridique</h2><table><tr><th>Finalité</th><th>Base juridique</th></tr><tr><td>Fonctionnement et sécurité du Site</td><td>Intérêt légitime du Responsable (art. 6.1.f RGPD)</td></tr><tr><td>Chargement des polices Google Fonts</td><td>Intérêt légitime du Responsable (art. 6.1.f RGPD)</td></tr></table>", "s4": "<h2>4. Destinataires des données</h2><p>Les données de navigation peuvent être traitées par des prestataires tiers agissant comme sous-traitants : le fournisseur d'hébergement/CDN du Site, et Google LLC pour Google Fonts. Les données ne sont ni vendues ni partagées avec des tiers à des fins marketing.</p>", "s5": "<h2>5. Transferts hors UE</h2><p>Certains prestataires tiers (ex. Google LLC) sont basés aux États-Unis. Les transferts de données hors UE reposent sur des clauses contractuelles types approuvées par la Commission européenne ou d'autres garanties appropriées prévues par le RGPD.</p>", "s6": "<h2>6. Durée de conservation</h2><p>Les données de navigation collectées automatiquement ne sont pas conservées plus longtemps que nécessaire pour garantir la sécurité et le bon fonctionnement du Site, sauf obligation légale contraire.</p>", "s7": "<h2>7. Droits de la personne concernée</h2><p>Conformément aux articles 15-22 du RGPD, la personne concernée peut demander à tout moment : l'accès à ses données, leur rectification ou suppression, la limitation du traitement, la portabilité des données, l'opposition au traitement, le retrait du consentement (le cas échéant).</p><p>Les demandes peuvent être envoyées à <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a>. La personne concernée a également le droit d'introduire une réclamation auprès de l'autorité italienne de protection des données (<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">www.garanteprivacy.it</a>).</p>", "s8": "<h2>8. Modifications de cette notice</h2><p>Le Responsable se réserve le droit de modifier cette notice à tout moment, en le notifiant sur cette page.</p>", "s9": "<h2>9. Contact</h2><p>Pour toute question relative à cette notice : <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "back_link": "← Retour au site", "footer_home": "Accueil", "footer_terms": "Conditions", "footer_app": "App"}, "de": {"title": "Datenschutzerklärung", "updated": "Letzte Aktualisierung: 30. Juli 2026", "intro": "<p>Diese Erklärung beschreibt, wie Like A Pro S.r.l. personenbezogene Daten verarbeitet, die über die Website <strong>www.likeapro.fun</strong> (die \"Website\") erhoben werden, gemäß Art. 13 und 14 der Verordnung (EU) 2016/679 (\"DSGVO\"). Sie betrifft ausschließlich die Website: die Datenverarbeitung im Zusammenhang mit der Nutzung der Like a Pro App (Registrierung, Ligen, Tipps, Abonnements) unterliegt einer separaten, in der App verfügbaren Erklärung.</p>", "s1": "<h2>1. Verantwortlicher</h2><p><strong>Like A Pro S.r.l.</strong><br>Viale Angelo Filippetti 26, 20122 Mailand (MI), Italien<br>USt-IdNr. 14837890962 — SDI-Code USAL8PV<br>E-Mail: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "s2": "<h2>2. Von der Website erhobene Daten</h2><p>Die Website ist eine statische Landingpage: Sie erfordert keine Registrierung, erhebt keine Daten über Formulare und verarbeitet keine Zahlungen. Die verarbeiteten Daten beschränken sich auf Folgendes:</p><h3>2.1 Nutzungsdaten</h3><p>Die Systeme der Website erfassen im normalen Betrieb bestimmte Daten, deren Übermittlung durch die Internet-Kommunikationsprotokolle bedingt ist (IP-Adresse, Browsertyp, Betriebssystem, besuchte Seiten, Zugriffszeiten), die nur für anonyme Statistiken und zur Überprüfung der ordnungsgemäßen Funktion verwendet werden.</p><h3>2.2 Cookies und ähnliche Technologien</h3><p>Die Website nutzt <strong>Google Fonts</strong> (Bebas Neue, Inter), die von Google-Servern zur Darstellung der Schriftarten geladen werden. Dabei wird die IP-Adresse des Besuchers an Google LLC (USA) übermittelt, auf Basis der von Google für Übermittlungen außerhalb der EU verwendeten Standardvertragsklauseln.</p><p>Die Website verwendet derzeit keine Profiling-, Marketing- oder Analyse-Cookies Dritter. Sollten künftig Analyse- oder Marketing-Tools eingeführt werden, werden diese Erklärung und der zugehörige Cookie-Banner entsprechend aktualisiert, mit Einwilligungsabfrage, wo gesetzlich vorgeschrieben.</p>", "s3": "<h2>3. Zwecke und Rechtsgrundlage</h2><table><tr><th>Zweck</th><th>Rechtsgrundlage</th></tr><tr><td>Betrieb und Sicherheit der Website</td><td>Berechtigtes Interesse des Verantwortlichen (Art. 6.1.f DSGVO)</td></tr><tr><td>Laden von Schriftarten von Google Fonts</td><td>Berechtigtes Interesse des Verantwortlichen (Art. 6.1.f DSGVO)</td></tr></table>", "s4": "<h2>4. Empfänger der Daten</h2><p>Nutzungsdaten können von Drittanbietern als Auftragsverarbeiter verarbeitet werden: dem Hosting-/CDN-Anbieter der Website und Google LLC für Google Fonts. Die Daten werden nicht verkauft oder zu Marketingzwecken an Dritte weitergegeben.</p>", "s5": "<h2>5. Übermittlung außerhalb der EU</h2><p>Einige Drittanbieter (z. B. Google LLC) haben ihren Sitz in den USA. Datenübermittlungen außerhalb der EU beruhen auf von der Europäischen Kommission genehmigten Standardvertragsklauseln oder anderen geeigneten Garantien gemäß DSGVO.</p>", "s6": "<h2>6. Speicherdauer</h2><p>Automatisch erhobene Nutzungsdaten werden nicht länger gespeichert, als zur Gewährleistung der Sicherheit und ordnungsgemäßen Funktion der Website erforderlich ist, sofern keine anderweitige gesetzliche Pflicht besteht.</p>", "s7": "<h2>7. Rechte der betroffenen Person</h2><p>Gemäß Art. 15-22 DSGVO kann die betroffene Person jederzeit verlangen: Auskunft über ihre Daten, Berichtigung oder Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit, Widerspruch gegen die Verarbeitung, Widerruf der Einwilligung (soweit anwendbar).</p><p>Anfragen können an <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a> gesendet werden. Die betroffene Person hat zudem das Recht, bei der italienischen Datenschutzbehörde Beschwerde einzulegen (<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">www.garanteprivacy.it</a>).</p>", "s8": "<h2>8. Änderungen dieser Erklärung</h2><p>Der Verantwortliche behält sich das Recht vor, diese Erklärung jederzeit zu ändern, mit Hinweis auf dieser Seite.</p>", "s9": "<h2>9. Kontakt</h2><p>Für Fragen zu dieser Erklärung: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "back_link": "← Zurück zur Website", "footer_home": "Startseite", "footer_terms": "AGB", "footer_app": "App"}, "pt": {"title": "Política de Privacidade", "updated": "Última atualização: 30 de julho de 2026", "intro": "<p>Este aviso descreve como a Like A Pro S.r.l. trata os dados pessoais recolhidos através do site <strong>www.likeapro.fun</strong> (o \"Site\"), nos termos dos artigos 13.º e 14.º do Regulamento (UE) 2016/679 (\"RGPD\"). Aplica-se apenas ao Site: o tratamento de dados relativo ao uso da app Like a Pro (registo, ligas, prognósticos, subscrições) é regulado por um aviso separado, disponível dentro da app.</p>", "s1": "<h2>1. Responsável pelo tratamento</h2><p><strong>Like A Pro S.r.l.</strong><br>Viale Angelo Filippetti 26, 20122 Milão (MI), Itália<br>NIF/IVA 14837890962 — Código SDI USAL8PV<br>Email: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "s2": "<h2>2. Dados recolhidos pelo Site</h2><p>O Site é uma landing page estática: não requer registo, não recolhe dados através de formulários e não processa pagamentos. Os dados tratados limitam-se ao seguinte:</p><h3>2.1 Dados de navegação</h3><p>Os sistemas do Site recolhem, no funcionamento normal, dados implícitos nos protocolos de comunicação da Internet (endereço IP, tipo de navegador, sistema operativo, páginas visitadas, horários de acesso), usados apenas para estatísticas anónimas e para verificar o correto funcionamento.</p><h3>2.2 Cookies e tecnologias semelhantes</h3><p>O Site utiliza <strong>Google Fonts</strong> (Bebas Neue, Inter), carregadas a partir de servidores da Google para exibir os tipos de letra. Isto implica a transmissão do endereço IP do visitante à Google LLC (EUA), com base nas cláusulas contratuais-tipo adotadas pela Google para transferências fora da UE.</p><p>O Site não utiliza atualmente cookies de definição de perfil, marketing ou análise de terceiros. Caso sejam introduzidas ferramentas de análise ou marketing no futuro, este aviso e o respetivo banner de cookies serão atualizados, com pedido de consentimento quando exigido por lei.</p>", "s3": "<h2>3. Finalidades e base jurídica</h2><table><tr><th>Finalidade</th><th>Base jurídica</th></tr><tr><td>Funcionamento e segurança do Site</td><td>Interesse legítimo do Responsável (art. 6.º, n.º 1, al. f) RGPD)</td></tr><tr><td>Carregamento de tipos de letra do Google Fonts</td><td>Interesse legítimo do Responsável (art. 6.º, n.º 1, al. f) RGPD)</td></tr></table>", "s4": "<h2>4. Destinatários dos dados</h2><p>Os dados de navegação podem ser tratados por prestadores terceiros que atuam como subcontratantes: o fornecedor de alojamento/CDN do Site, e a Google LLC para o Google Fonts. Os dados não são vendidos nem partilhados com terceiros para fins de marketing.</p>", "s5": "<h2>5. Transferências fora da UE</h2><p>Alguns prestadores terceiros (ex. Google LLC) estão sediados nos Estados Unidos. As transferências de dados para fora da UE baseiam-se em cláusulas contratuais-tipo aprovadas pela Comissão Europeia ou noutras garantias adequadas previstas no RGPD.</p>", "s6": "<h2>6. Prazo de conservação</h2><p>Os dados de navegação recolhidos automaticamente não são conservados por mais tempo do que o necessário para garantir a segurança e o correto funcionamento do Site, salvo obrigação legal diversa.</p>", "s7": "<h2>7. Direitos do titular dos dados</h2><p>Nos termos dos artigos 15.º-22.º do RGPD, o titular pode solicitar a qualquer momento: acesso aos seus dados, retificação ou apagamento, limitação do tratamento, portabilidade dos dados, oposição ao tratamento, retirada do consentimento (quando aplicável).</p><p>Os pedidos podem ser enviados para <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a>. O titular tem também o direito de apresentar reclamação junto da Autoridade Italiana de Proteção de Dados (<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">www.garanteprivacy.it</a>).</p>", "s8": "<h2>8. Alterações a este aviso</h2><p>O Responsável reserva-se o direito de alterar este aviso a qualquer momento, notificando os utilizadores nesta página.</p>", "s9": "<h2>9. Contacto</h2><p>Para questões relativas a este aviso: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "back_link": "← Voltar ao site", "footer_home": "Início", "footer_terms": "Termos", "footer_app": "App"}, "zh": {"title": "隐私政策", "updated": "最后更新：2026年7月30日", "intro": "<p>本声明说明 Like A Pro S.r.l.（以下简称\"我们\"）如何处理通过网站 <strong>www.likeapro.fun</strong>（\"本网站\"）收集的个人数据，依据《通用数据保护条例》（欧盟2016/679号法规，\"GDPR\"）第13条和第14条。本声明仅适用于本网站：使用 Like a Pro 应用程序（注册、联赛、预测、订阅）所涉及的数据处理由应用内单独的声明规范。</p>", "s1": "<h2>1. 数据控制者</h2><p><strong>Like A Pro S.r.l.</strong><br>Viale Angelo Filippetti 26, 20122 米兰（MI），意大利<br>增值税号 14837890962 — SDI 代码 USAL8PV<br>邮箱：<a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "s2": "<h2>2. 本网站收集的数据</h2><p>本网站是一个静态着陆页：不需要注册，不通过表单收集数据，也不处理支付。所处理的数据仅限于以下内容：</p><h3>2.1 浏览数据</h3><p>本网站的系统在正常运行过程中会获取互联网通信协议中隐含传输的某些数据（IP 地址、浏览器类型、操作系统、访问页面、访问时间），仅用于匿名统计和验证网站的正常运行。</p><h3>2.2 Cookie 及类似技术</h3><p>本网站使用 <strong>Google Fonts</strong>（Bebas Neue、Inter），从 Google 服务器加载以显示字体。这会将访客的 IP 地址传输给 Google LLC（美国），依据 Google 用于欧盟境外数据传输的标准合同条款进行。</p><p>本网站目前不使用任何第三方的画像、营销或分析类 Cookie。若未来引入分析或营销工具，本声明及相关 Cookie 提示横幅将相应更新，并在法律要求时征求用户同意。</p>", "s3": "<h2>3. 处理目的与法律依据</h2><table><tr><th>目的</th><th>法律依据</th></tr><tr><td>网站运行与安全</td><td>数据控制者的合法利益（GDPR 第6.1(f)条）</td></tr><tr><td>加载 Google Fonts 字体</td><td>数据控制者的合法利益（GDPR 第6.1(f)条）</td></tr></table>", "s4": "<h2>4. 数据接收方</h2><p>浏览数据可能由作为数据处理者的第三方服务商处理：托管本网站的主机/CDN 提供商，以及提供 Google Fonts 服务的 Google LLC。数据不会被出售，也不会因营销目的与第三方共享。</p>", "s5": "<h2>5. 欧盟境外数据传输</h2><p>部分第三方服务商（如 Google LLC）总部位于美国。数据向欧盟境外的传输依据欧盟委员会批准的标准合同条款，或 GDPR 规定的其他适当保障措施进行。</p>", "s6": "<h2>6. 数据保留期限</h2><p>自动收集的浏览数据的保留时间不会超过保障网站安全和正常运行所需的时间，除非法律另有规定。</p>", "s7": "<h2>7. 数据主体的权利</h2><p>依据 GDPR 第15-22条，数据主体可随时要求：查阅个人数据、更正或删除数据、限制处理、数据可携带权、反对处理、撤回同意（如适用）。</p><p>相关请求可发送至 <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a>。数据主体还有权向意大利数据保护局提出投诉（<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">www.garanteprivacy.it</a>）。</p>", "s8": "<h2>8. 本声明的变更</h2><p>数据控制者保留随时修改本声明的权利，并将在本页面通知用户。</p>", "s9": "<h2>9. 联系方式</h2><p>如对本声明有任何疑问，请联系：<a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "back_link": "← 返回网站", "footer_home": "首页", "footer_terms": "条款", "footer_app": "应用"}, "ja": {"title": "プライバシーポリシー", "updated": "最終更新日：2026年7月30日", "intro": "<p>本ポリシーは、Like A Pro S.r.l. がウェブサイト <strong>www.likeapro.fun</strong>（以下「本サイト」）を通じて収集する個人データの取り扱いについて、EU一般データ保護規則（Regulation (EU) 2016/679、以下「GDPR」）第13条および第14条に基づき説明するものです。本ポリシーは本サイトのみを対象とします。Like a Pro アプリ（登録、リーグ、予想、サブスクリプション）の利用に関するデータ処理は、アプリ内の別のポリシーに従います。</p>", "s1": "<h2>1. データ管理者</h2><p><strong>Like A Pro S.r.l.</strong><br>Viale Angelo Filippetti 26, 20122 ミラノ（MI）、イタリア<br>VAT/税務ID 14837890962 — SDIコード USAL8PV<br>メール：<a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "s2": "<h2>2. 本サイトが収集するデータ</h2><p>本サイトは静的なランディングページであり、登録は不要、フォームによるデータ収集もなく、決済も処理しません。取り扱うデータは以下に限られます。</p><h3>2.1 閲覧データ</h3><p>本サイトのシステムは、通常運用の一環として、インターネット通信プロトコルに暗黙的に含まれるデータ（IPアドレス、ブラウザの種類、OS、閲覧ページ、アクセス時間）を取得しますが、これは匿名の統計情報の取得とサイトの正常な動作確認のためにのみ使用されます。</p><h3>2.2 クッキーおよび類似技術</h3><p>本サイトはフォント表示のために Google のサーバーから読み込まれる <strong>Google Fonts</strong>（Bebas Neue、Inter）を使用しています。これにより訪問者のIPアドレスが Google LLC（米国）に送信されますが、これは Google がEU域外への移転に使用する標準契約条項に基づいています。</p><p>本サイトは現在、プロファイリング、マーケティング、第三者による分析用クッキーを使用していません。将来的に分析ツールやマーケティングツールが導入される場合、本ポリシーおよび関連するクッキーバナーを更新し、法律で必要な場合は同意を求めます。</p>", "s3": "<h2>3. 目的および法的根拠</h2><table><tr><th>目的</th><th>法的根拠</th></tr><tr><td>サイトの運用とセキュリティ</td><td>データ管理者の正当な利益（GDPR第6条1項f号）</td></tr><tr><td>Google Fontsの読み込み</td><td>データ管理者の正当な利益（GDPR第6条1項f号）</td></tr></table>", "s4": "<h2>4. データの提供先</h2><p>閲覧データは、処理者として行動する第三者プロバイダーによって処理される場合があります：本サイトをホストするホスティング/CDNプロバイダー、および Google Fontsを提供する Google LLC。データはマーケティング目的で第三者に販売または共有されることはありません。</p>", "s5": "<h2>5. EU域外への移転</h2><p>一部の第三者プロバイダー（例：Google LLC）は米国に拠点を置いています。EU域外へのデータ移転は、欧州委員会が承認した標準契約条項、またはGDPRが定めるその他の適切な保護措置に基づいて行われます。</p>", "s6": "<h2>6. 保存期間</h2><p>自動的に収集される閲覧データは、法律で別途定められている場合を除き、サイトのセキュリティと正常な運用を確保するために必要な期間を超えて保存されることはありません。</p>", "s7": "<h2>7. データ主体の権利</h2><p>GDPR第15条から第22条に基づき、データ主体はいつでも次の権利を行使できます：自己データへのアクセス、訂正または削除、処理の制限、データポータビリティ、処理への異議、同意の撤回（該当する場合）。</p><p>ご請求は <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a> までお送りください。データ主体はまた、イタリアデータ保護局（<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">www.garanteprivacy.it</a>）に苦情を申し立てる権利も有します。</p>", "s8": "<h2>8. 本ポリシーの変更</h2><p>データ管理者は、本ページ上で通知の上、いつでも本ポリシーを変更する権利を留保します。</p>", "s9": "<h2>9. お問い合わせ</h2><p>本ポリシーに関するご質問は <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a> までご連絡ください。</p>", "back_link": "← サイトに戻る", "footer_home": "ホーム", "footer_terms": "利用規約", "footer_app": "アプリ"}, "ar": {"title": "سياسة الخصوصية", "updated": "آخر تحديث: 30 يوليو 2026", "intro": "<p>يوضّح هذا الإشعار كيفية معالجة شركة Like A Pro S.r.l. للبيانات الشخصية التي يتم جمعها عبر موقع <strong>www.likeapro.fun</strong> (\"الموقع\")، وفقاً للمادتين 13 و14 من اللائحة (الاتحاد الأوروبي) 2016/679 (\"GDPR\"). يخص هذا الإشعار الموقع فقط: تخضع معالجة البيانات المتعلقة باستخدام تطبيق Like a Pro (التسجيل، الدوريات، التوقعات، الاشتراكات) لإشعار منفصل متاح داخل التطبيق.</p>", "s1": "<h2>1. المتحكم في البيانات</h2><p><strong>Like A Pro S.r.l.</strong><br>Viale Angelo Filippetti 26, 20122 ميلانو (MI)، إيطاليا<br>الرقم الضريبي 14837890962 — رمز SDI USAL8PV<br>البريد الإلكتروني: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "s2": "<h2>2. البيانات التي يجمعها الموقع</h2><p>الموقع هو صفحة هبوط ثابتة: لا يتطلب التسجيل، ولا يجمع بيانات عبر النماذج، ولا يعالج أي مدفوعات. تقتصر البيانات المعالجة على ما يلي:</p><h3>2.1 بيانات التصفح</h3><p>تجمع أنظمة الموقع، في إطار تشغيلها الطبيعي، بعض البيانات الضمنية في بروتوكولات اتصال الإنترنت (عنوان IP، نوع المتصفح، نظام التشغيل، الصفحات التي تمت زيارتها، أوقات الوصول)، وتُستخدم فقط لأغراض إحصائية مجهولة الهوية والتحقق من عمل الموقع بشكل صحيح.</p><h3>2.2 ملفات تعريف الارتباط والتقنيات المشابهة</h3><p>يستخدم الموقع <strong>Google Fonts</strong> (Bebas Neue، Inter)، التي يتم تحميلها من خوادم Google لعرض الخطوط. يستلزم ذلك نقل عنوان IP الخاص بالزائر إلى Google LLC (الولايات المتحدة)، استناداً إلى البنود التعاقدية القياسية التي تعتمدها Google لعمليات النقل خارج الاتحاد الأوروبي.</p><p>لا يستخدم الموقع حالياً أي ملفات تعريف ارتباط للتنميط أو التسويق أو التحليل من طرف ثالث. في حال إدخال أدوات تحليل أو تسويق مستقبلاً، سيتم تحديث هذا الإشعار وشعار ملفات تعريف الارتباط ذي الصلة، مع طلب الموافقة حيثما يقتضي القانون ذلك.</p>", "s3": "<h2>3. الأغراض والأساس القانوني</h2><table><tr><th>الغرض</th><th>الأساس القانوني</th></tr><tr><td>تشغيل الموقع وأمانه</td><td>المصلحة المشروعة للمتحكم (المادة 6.1.و من GDPR)</td></tr><tr><td>تحميل الخطوط من Google Fonts</td><td>المصلحة المشروعة للمتحكم (المادة 6.1.و من GDPR)</td></tr></table>", "s4": "<h2>4. الجهات المستلمة للبيانات</h2><p>يمكن معالجة بيانات التصفح من قبل مزودين خارجيين يعملون كمعالجين للبيانات: مزود الاستضافة/CDN الذي يستضيف الموقع، وGoogle LLC لتوفير خدمة Google Fonts. لا يتم بيع البيانات أو مشاركتها مع أطراف ثالثة لأغراض تسويقية.</p>", "s5": "<h2>5. نقل البيانات خارج الاتحاد الأوروبي</h2><p>يقع بعض المزودين الخارجيين (مثل Google LLC) في الولايات المتحدة. يتم نقل البيانات خارج الاتحاد الأوروبي بناءً على بنود تعاقدية قياسية معتمدة من المفوضية الأوروبية أو ضمانات ملائمة أخرى ينص عليها GDPR.</p>", "s6": "<h2>6. مدة الاحتفاظ بالبيانات</h2><p>لا يتم الاحتفاظ ببيانات التصفح التي يتم جمعها تلقائياً لمدة أطول مما هو ضروري لضمان أمان الموقع وتشغيله بشكل صحيح، ما لم يقتضِ القانون خلاف ذلك.</p>", "s7": "<h2>7. حقوق صاحب البيانات</h2><p>وفقاً للمواد 15-22 من GDPR، يحق لصاحب البيانات أن يطلب في أي وقت: الوصول إلى بياناته، تصحيحها أو حذفها، تقييد المعالجة، نقل البيانات، الاعتراض على المعالجة، سحب الموافقة (حيثما ينطبق ذلك).</p><p>يمكن إرسال الطلبات إلى <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a>. يحق لصاحب البيانات أيضاً تقديم شكوى إلى الهيئة الإيطالية لحماية البيانات (<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">www.garanteprivacy.it</a>).</p>", "s8": "<h2>8. التغييرات على هذا الإشعار</h2><p>يحتفظ المتحكم بالحق في تعديل هذا الإشعار في أي وقت، مع إخطار المستخدمين عبر هذه الصفحة.</p>", "s9": "<h2>9. التواصل</h2><p>لأي استفسار بخصوص هذا الإشعار: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "back_link": "← العودة إلى الموقع", "footer_home": "الرئيسية", "footer_terms": "الشروط", "footer_app": "التطبيق"}, "hi": {"title": "प्राइवेसी पॉलिसी", "updated": "आख़िरी अपडेट: 30 जुलाई 2026", "intro": "<p>यह नोटिस बताता है कि Like A Pro S.r.l. वेबसाइट <strong>www.likeapro.fun</strong> (\"साइट\") के ज़रिए एकत्र किए गए पर्सनल डेटा को कैसे प्रोसेस करती है, यूरोपियन यूनियन के रेगुलेशन (EU) 2016/679 (\"GDPR\") के आर्टिकल 13 और 14 के अनुसार। यह नोटिस सिर्फ़ साइट पर लागू होता है: Like a Pro ऐप (रजिस्ट्रेशन, लीग, prediction, सब्सक्रिप्शन) के इस्तेमाल से जुड़े डेटा प्रोसेसिंग के लिए ऐप के अंदर एक अलग नोटिस मौजूद है।</p>", "s1": "<h2>1. डेटा कंट्रोलर</h2><p><strong>Like A Pro S.r.l.</strong><br>Viale Angelo Filippetti 26, 20122 मिलान (MI), इटली<br>VAT/टैक्स ID 14837890962 — SDI कोड USAL8PV<br>ईमेल: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "s2": "<h2>2. साइट द्वारा एकत्रित डेटा</h2><p>साइट एक स्टैटिक लैंडिंग पेज है: इसमें रजिस्ट्रेशन ज़रूरी नहीं है, फॉर्म के ज़रिए कोई डेटा नहीं लिया जाता और कोई पेमेंट प्रोसेस नहीं होता। प्रोसेस किया गया डेटा सिर्फ़ इन तक सीमित है:</p><h3>2.1 ब्राउज़िंग डेटा</h3><p>साइट के सिस्टम, सामान्य ऑपरेशन के दौरान, इंटरनेट कम्युनिकेशन प्रोटोकॉल में शामिल कुछ डेटा (IP एड्रेस, ब्राउज़र टाइप, ऑपरेटिंग सिस्टम, देखे गए पेज, एक्सेस टाइम) प्राप्त करते हैं, जिनका इस्तेमाल सिर्फ़ anonymous statistics और साइट के सही तरीक़े से काम करने की जांच के लिए होता है।</p><h3>2.2 कुकीज़ और इसी तरह की तकनीकें</h3><p>साइट फॉन्ट दिखाने के लिए Google के सर्वर से लोड होने वाले <strong>Google Fonts</strong> (Bebas Neue, Inter) का इस्तेमाल करती है। इससे विज़िटर का IP एड्रेस Google LLC (USA) तक पहुंचता है, जो EU से बाहर डेटा ट्रांसफ़र के लिए Google द्वारा अपनाए गए स्टैंडर्ड कॉन्ट्रैक्चुअल क्लॉज़ पर आधारित है।</p><p>फ़िलहाल साइट किसी भी तरह की प्रोफाइलिंग, मार्केटिंग या थर्ड-पार्टी एनालिटिक्स कुकीज़ का इस्तेमाल नहीं करती। भविष्य में अगर एनालिटिक्स या मार्केटिंग टूल्स जोड़े जाते हैं, तो यह नोटिस और संबंधित कुकी बैनर अपडेट किए जाएंगे, और जहां क़ानूनन ज़रूरी होगा वहां सहमति मांगी जाएगी।</p>", "s3": "<h2>3. उद्देश्य और लीगल बेसिस</h2><table><tr><th>उद्देश्य</th><th>लीगल बेसिस</th></tr><tr><td>साइट का संचालन और सुरक्षा</td><td>कंट्रोलर का वैध हित (GDPR आर्टिकल 6.1.f)</td></tr><tr><td>Google Fonts से फॉन्ट लोड करना</td><td>कंट्रोलर का वैध हित (GDPR आर्टिकल 6.1.f)</td></tr></table>", "s4": "<h2>4. डेटा पाने वाले</h2><p>ब्राउज़िंग डेटा को थर्ड-पार्टी प्रोवाइडर्स प्रोसेस कर सकते हैं जो डेटा प्रोसेसर के रूप में काम करते हैं: साइट को होस्ट करने वाला होस्टिंग/CDN प्रोवाइडर, और Google Fonts उपलब्ध कराने वाली Google LLC। डेटा को बेचा नहीं जाता और न ही मार्केटिंग के मक़सद से थर्ड पार्टीज़ के साथ शेयर किया जाता है।</p>", "s5": "<h2>5. EU से बाहर डेटा ट्रांसफ़र</h2><p>कुछ थर्ड-पार्टी प्रोवाइडर्स (जैसे Google LLC) अमेरिका में स्थित हैं। EU से बाहर डेटा ट्रांसफ़र यूरोपियन कमीशन द्वारा अप्रूव्ड स्टैंडर्ड कॉन्ट्रैक्चुअल क्लॉज़ या GDPR में बताए गए अन्य उचित सुरक्षा उपायों पर आधारित होता है।</p>", "s6": "<h2>6. डेटा रिटेंशन अवधि</h2><p>अपने आप एकत्रित किया गया ब्राउज़िंग डेटा साइट की सुरक्षा और सही ऑपरेशन सुनिश्चित करने के लिए ज़रूरी समय से ज़्यादा नहीं रखा जाता, जब तक कि क़ानून अलग से न कहे।</p>", "s7": "<h2>7. डेटा सब्जेक्ट के अधिकार</h2><p>GDPR के आर्टिकल 15-22 के तहत, डेटा सब्जेक्ट कभी भी यह मांग सकता है: अपने डेटा तक पहुंच, सुधार या डिलीशन, प्रोसेसिंग की सीमा, डेटा पोर्टेबिलिटी, प्रोसेसिंग पर आपत्ति, सहमति वापस लेना (जहां लागू हो)।</p><p>रिक्वेस्ट <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a> पर भेजी जा सकती हैं। डेटा सब्जेक्ट को इटैलियन डेटा प्रोटेक्शन अथॉरिटी के पास शिकायत दर्ज करने का भी अधिकार है (<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">www.garanteprivacy.it</a>)।</p>", "s8": "<h2>8. इस नोटिस में बदलाव</h2><p>कंट्रोलर के पास इस नोटिस को कभी भी बदलने का अधिकार सुरक्षित है, और इसकी जानकारी इसी पेज पर दी जाएगी।</p>", "s9": "<h2>9. संपर्क</h2><p>इस नोटिस से जुड़े किसी भी सवाल के लिए: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "back_link": "← साइट पर वापस जाएं", "footer_home": "होम", "footer_terms": "नियम व शर्तें", "footer_app": "ऐप"}, "ru": {"title": "Политика конфиденциальности", "updated": "Последнее обновление: 30 июля 2026 г.", "intro": "<p>В этом документе описано, как Like A Pro S.r.l. обрабатывает персональные данные, собранные через сайт <strong>www.likeapro.fun</strong> (\"Сайт\"), в соответствии со статьями 13 и 14 Регламента (ЕС) 2016/679 (\"GDPR\"). Документ касается только Сайта: обработка данных, связанная с использованием приложения Like a Pro (регистрация, лиги, прогнозы, подписки), регулируется отдельным документом внутри приложения.</p>", "s1": "<h2>1. Контролёр данных</h2><p><strong>Like A Pro S.r.l.</strong><br>Viale Angelo Filippetti 26, 20122 Милан (MI), Италия<br>VAT/налоговый номер 14837890962 — Код SDI USAL8PV<br>Email: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "s2": "<h2>2. Данные, собираемые Сайтом</h2><p>Сайт представляет собой статическую целевую страницу: не требует регистрации, не собирает данные через формы и не обрабатывает платежи. Обрабатываемые данные ограничены следующим:</p><h3>2.1 Данные о просмотре</h3><p>Системы Сайта в рамках обычной работы получают некоторые данные, передача которых подразумевается протоколами интернет-связи (IP-адрес, тип браузера, операционная система, посещённые страницы, время доступа), используемые только для анонимной статистики и проверки корректной работы Сайта.</p><h3>2.2 Файлы cookie и похожие технологии</h3><p>Сайт использует <strong>Google Fonts</strong> (Bebas Neue, Inter), загружаемые с серверов Google для отображения шрифтов. Это подразумевает передачу IP-адреса посетителя компании Google LLC (США) на основе стандартных договорных положений, которые Google применяет для передачи данных за пределы ЕС.</p><p>В настоящее время Сайт не использует профилирующие, маркетинговые или сторонние аналитические файлы cookie. Если в будущем будут внедрены инструменты аналитики или маркетинга, этот документ и соответствующий баннер cookie будут обновлены, с запросом согласия там, где это требуется законом.</p>", "s3": "<h2>3. Цели и правовые основания</h2><table><tr><th>Цель</th><th>Правовое основание</th></tr><tr><td>Работа и безопасность Сайта</td><td>Законный интерес Контролёра (ст. 6.1.f GDPR)</td></tr><tr><td>Загрузка шрифтов Google Fonts</td><td>Законный интерес Контролёра (ст. 6.1.f GDPR)</td></tr></table>", "s4": "<h2>4. Получатели данных</h2><p>Данные о просмотре могут обрабатываться сторонними поставщиками, выступающими в роли обработчиков данных: провайдером хостинга/CDN, который размещает Сайт, и Google LLC для предоставления Google Fonts. Данные не продаются и не передаются третьим лицам в маркетинговых целях.</p>", "s5": "<h2>5. Передача данных за пределы ЕС</h2><p>Некоторые сторонние поставщики (например, Google LLC) базируются в США. Передача данных за пределы ЕС осуществляется на основе стандартных договорных положений, утверждённых Европейской комиссией, или иных надлежащих гарантий, предусмотренных GDPR.</p>", "s6": "<h2>6. Срок хранения</h2><p>Автоматически собранные данные о просмотре не хранятся дольше, чем это необходимо для обеспечения безопасности и корректной работы Сайта, если иное не предусмотрено законом.</p>", "s7": "<h2>7. Права субъекта данных</h2><p>В соответствии со статьями 15-22 GDPR субъект данных может в любое время запросить: доступ к своим данным, их исправление или удаление, ограничение обработки, переносимость данных, возражение против обработки, отзыв согласия (если применимо).</p><p>Запросы можно направлять на <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a>. Субъект данных также имеет право подать жалобу в итальянский орган по защите данных (<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">www.garanteprivacy.it</a>).</p>", "s8": "<h2>8. Изменения в этом документе</h2><p>Контролёр оставляет за собой право изменять этот документ в любое время, уведомляя об этом на данной странице.</p>", "s9": "<h2>9. Контакты</h2><p>По любым вопросам, связанным с этим документом: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "back_link": "← Вернуться на сайт", "footer_home": "Главная", "footer_terms": "Условия", "footer_app": "Приложение"}, "pl": {"title": "Polityka prywatności", "updated": "Ostatnia aktualizacja: 30 lipca 2026", "intro": "<p>Niniejsza informacja opisuje, w jaki sposób Like A Pro S.r.l. przetwarza dane osobowe zbierane za pośrednictwem strony <strong>www.likeapro.fun</strong> (\"Strona\"), zgodnie z art. 13 i 14 Rozporządzenia (UE) 2016/679 (\"RODO\"). Dotyczy wyłącznie Strony: przetwarzanie danych związane z korzystaniem z aplikacji Like a Pro (rejestracja, ligi, typy, subskrypcje) regulowane jest odrębną informacją dostępną w aplikacji.</p>", "s1": "<h2>1. Administrator danych</h2><p><strong>Like A Pro S.r.l.</strong><br>Viale Angelo Filippetti 26, 20122 Mediolan (MI), Włochy<br>NIP/VAT 14837890962 — Kod SDI USAL8PV<br>Email: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "s2": "<h2>2. Dane zbierane przez Stronę</h2><p>Strona jest statyczną landing page: nie wymaga rejestracji, nie zbiera danych poprzez formularze i nie przetwarza płatności. Przetwarzane dane ograniczają się do poniższych:</p><h3>2.1 Dane o przeglądaniu</h3><p>Systemy Strony pozyskują, w ramach normalnego działania, pewne dane wynikające z protokołów komunikacji internetowej (adres IP, typ przeglądarki, system operacyjny, odwiedzone strony, godziny dostępu), wykorzystywane wyłącznie do anonimowych statystyk i weryfikacji prawidłowego działania Strony.</p><h3>2.2 Cookies i podobne technologie</h3><p>Strona korzysta z <strong>Google Fonts</strong> (Bebas Neue, Inter), ładowanych z serwerów Google w celu wyświetlania czcionek. Wiąże się to z przesyłaniem adresu IP odwiedzającego do Google LLC (USA), na podstawie standardowych klauzul umownych stosowanych przez Google przy transferach poza UE.</p><p>Strona nie wykorzystuje obecnie plików cookie do profilowania, marketingu ani analityki podmiotów trzecich. Jeśli w przyszłości zostaną wprowadzone narzędzia analityczne lub marketingowe, niniejsza informacja i baner cookies zostaną odpowiednio zaktualizowane, z prośbą o zgodę tam, gdzie wymaga tego prawo.</p>", "s3": "<h2>3. Cele i podstawa prawna</h2><table><tr><th>Cel</th><th>Podstawa prawna</th></tr><tr><td>Działanie i bezpieczeństwo Strony</td><td>Prawnie uzasadniony interes Administratora (art. 6 ust. 1 lit. f RODO)</td></tr><tr><td>Ładowanie czcionek z Google Fonts</td><td>Prawnie uzasadniony interes Administratora (art. 6 ust. 1 lit. f RODO)</td></tr></table>", "s4": "<h2>4. Odbiorcy danych</h2><p>Dane o przeglądaniu mogą być przetwarzane przez zewnętrznych dostawców działających jako podmioty przetwarzające: dostawcę hostingu/CDN Strony oraz Google LLC w zakresie Google Fonts. Dane nie są sprzedawane ani udostępniane podmiotom trzecim w celach marketingowych.</p>", "s5": "<h2>5. Transfer danych poza UE</h2><p>Niektórzy zewnętrzni dostawcy (np. Google LLC) mają siedzibę w Stanach Zjednoczonych. Transfer danych poza UE odbywa się na podstawie standardowych klauzul umownych zatwierdzonych przez Komisję Europejską lub innych odpowiednich zabezpieczeń przewidzianych przez RODO.</p>", "s6": "<h2>6. Okres przechowywania</h2><p>Automatycznie zbierane dane o przeglądaniu nie są przechowywane dłużej, niż jest to konieczne do zapewnienia bezpieczeństwa i prawidłowego działania Strony, chyba że prawo stanowi inaczej.</p>", "s7": "<h2>7. Prawa osoby, której dane dotyczą</h2><p>Zgodnie z art. 15-22 RODO, osoba, której dane dotyczą, może w każdej chwili zażądać: dostępu do swoich danych, ich sprostowania lub usunięcia, ograniczenia przetwarzania, przenoszenia danych, sprzeciwu wobec przetwarzania, wycofania zgody (jeśli dotyczy).</p><p>Żądania można kierować na adres <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a>. Osoba, której dane dotyczą, ma również prawo wniesienia skargi do włoskiego organu ochrony danych osobowych (<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">www.garanteprivacy.it</a>).</p>", "s8": "<h2>8. Zmiany niniejszej informacji</h2><p>Administrator zastrzega sobie prawo do zmiany niniejszej informacji w dowolnym momencie, powiadamiając o tym na tej stronie.</p>", "s9": "<h2>9. Kontakt</h2><p>W sprawie pytań dotyczących niniejszej informacji: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "back_link": "← Powrót do strony", "footer_home": "Strona główna", "footer_terms": "Regulamin", "footer_app": "Aplikacja"}, "sr": {"title": "Politika privatnosti", "updated": "Poslednje ažuriranje: 30. jul 2026.", "intro": "<p>Ovo obaveštenje opisuje kako Like A Pro S.r.l. obrađuje lične podatke prikupljene putem sajta <strong>www.likeapro.fun</strong> (\"Sajt\"), u skladu sa članovima 13. i 14. Uredbe (EU) 2016/679 (\"GDPR\"). Odnosi se isključivo na Sajt: obrada podataka u vezi sa korišćenjem Like a Pro aplikacije (registracija, lige, predviđanja, pretplate) regulisana je posebnim obaveštenjem dostupnim unutar aplikacije.</p>", "s1": "<h2>1. Kontrolor podataka</h2><p><strong>Like A Pro S.r.l.</strong><br>Viale Angelo Filippetti 26, 20122 Milano (MI), Italija<br>PDV broj 14837890962 — SDI kod USAL8PV<br>Email: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "s2": "<h2>2. Podaci koje prikuplja Sajt</h2><p>Sajt je statička landing stranica: ne zahteva registraciju, ne prikuplja podatke putem formulara i ne obrađuje plaćanja. Obrađeni podaci ograničeni su na sledeće:</p><h3>2.1 Podaci o pregledanju</h3><p>Sistemi Sajta, u okviru normalnog rada, prikupljaju određene podatke koji su implicitni u internet komunikacionim protokolima (IP adresa, tip pregledača, operativni sistem, posećene stranice, vreme pristupa), koji se koriste isključivo za anonimnu statistiku i proveru ispravnog rada Sajta.</p><h3>2.2 Kolačići i slične tehnologije</h3><p>Sajt koristi <strong>Google Fonts</strong> (Bebas Neue, Inter), koji se učitavaju sa Google servera radi prikaza fontova. Ovo podrazumeva prenos IP adrese posetioca ka Google LLC (SAD), na osnovu standardnih ugovornih klauzula koje Google koristi za prenos podataka izvan EU.</p><p>Sajt trenutno ne koristi kolačiće za profilisanje, marketing ili analitiku trećih strana. Ukoliko se u budućnosti uvedu alati za analitiku ili marketing, ovo obaveštenje i pripadajući baner o kolačićima biće ažurirani, uz traženje saglasnosti tamo gde to zakon zahteva.</p>", "s3": "<h2>3. Svrhe i pravni osnov</h2><table><tr><th>Svrha</th><th>Pravni osnov</th></tr><tr><td>Rad i bezbednost Sajta</td><td>Legitimni interes Kontrolora (čl. 6.1.f GDPR)</td></tr><tr><td>Učitavanje fontova sa Google Fonts</td><td>Legitimni interes Kontrolora (čl. 6.1.f GDPR)</td></tr></table>", "s4": "<h2>4. Primaoci podataka</h2><p>Podatke o pregledanju mogu obrađivati treće strane koje deluju kao obrađivači podataka: provajder hostinga/CDN-a koji hostuje Sajt, i Google LLC za Google Fonts. Podaci se ne prodaju niti dele sa trećim stranama u marketinške svrhe.</p>", "s5": "<h2>5. Prenos podataka izvan EU</h2><p>Neki spoljni provajderi (npr. Google LLC) imaju sedište u Sjedinjenim Državama. Prenos podataka izvan EU zasniva se na standardnim ugovornim klauzulama koje je odobrila Evropska komisija, ili drugim odgovarajućim garancijama predviđenim GDPR-om.</p>", "s6": "<h2>6. Period čuvanja</h2><p>Automatski prikupljeni podaci o pregledanju ne čuvaju se duže nego što je neophodno za obezbeđivanje bezbednosti i ispravnog rada Sajta, osim ako zakon ne nalaže drugačije.</p>", "s7": "<h2>7. Prava lica na koje se podaci odnose</h2><p>U skladu sa članovima 15-22 GDPR-a, lice na koje se podaci odnose može u bilo kom trenutku zatražiti: pristup svojim podacima, ispravku ili brisanje, ograničenje obrade, prenosivost podataka, prigovor na obradu, povlačenje saglasnosti (kada je primenjivo).</p><p>Zahtevi se mogu poslati na <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a>. Lice na koje se podaci odnose takođe ima pravo da podnese pritužbu italijanskom telu za zaštitu podataka (<a href=\"https://www.garanteprivacy.it\" target=\"_blank\" rel=\"noopener\">www.garanteprivacy.it</a>).</p>", "s8": "<h2>8. Izmene ovog obaveštenja</h2><p>Kontrolor zadržava pravo da izmeni ovo obaveštenje u bilo kom trenutku, obaveštavajući korisnike na ovoj stranici.</p>", "s9": "<h2>9. Kontakt</h2><p>Za pitanja u vezi sa ovim obaveštenjem: <a href=\"mailto:privacy@likeapro.fun\">privacy@likeapro.fun</a></p>", "back_link": "← Nazad na sajt", "footer_home": "Početna", "footer_terms": "Uslovi", "footer_app": "Aplikacija"}};
  const LANGS = [["it", "🇮🇹", "Italiano"], ["en", "🇬🇧", "English"], ["es", "🇪🇸", "Español"], ["fr", "🇫🇷", "Français"], ["de", "🇩🇪", "Deutsch"], ["pt", "🇵🇹", "Português"], ["zh", "🇨🇳", "中文"], ["ja", "🇯🇵", "日本語"], ["ar", "🇸🇦", "العربية"], ["hi", "🇮🇳", "हिन्दी"], ["ru", "🇷🇺", "Русский"], ["pl", "🇵🇱", "Polski"], ["sr", "🇷🇸", "Srpski"]];
  const RTL = ["ar"];

  const langMenu = document.getElementById('langMenu');
  const langBtn = document.getElementById('langBtn');
  const langFlagCurrent = document.getElementById('langFlagCurrent');
  const htmlRoot = document.getElementById('htmlRoot');

  function buildMenu(active){
    langMenu.innerHTML = '';
    LANGS.forEach(([code, flag, label]) => {
      const item = document.createElement('div');
      item.className = 'lang-item' + (code === active ? ' active' : '');
      item.setAttribute('role','option');
      item.innerHTML = '<span class="lang-flag">' + flag + '</span><span>' + label + '</span>';
      item.addEventListener('click', () => { setLang(code); langMenu.classList.remove('open'); });
      langMenu.appendChild(item);
    });
  }

  function setLang(code){
    if(!I18N[code]) code = 'it';
    const dict = I18N[code];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(dict[key] !== undefined) el.innerHTML = dict[key];
    });
    const isRTL = RTL.includes(code);
    htmlRoot.setAttribute('lang', code);
    htmlRoot.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
    const flagEntry = LANGS.find(l => l[0] === code);
    langFlagCurrent.textContent = flagEntry ? flagEntry[1] : '🇮🇹';
    buildMenu(code);
    try{ localStorage.setItem('lapro_lang', code); }catch(e){}
    const suffix = code === 'it' ? '' : ('?lang=' + code);
    document.getElementById('backLink').href = 'index.html' + suffix;
    document.getElementById('footHomeLink').href = 'index.html' + suffix;
    document.getElementById('footTermsLink').href = 'termini.html' + suffix;
  }

  function detectDefaultLang(){
    try{
      const saved = localStorage.getItem('lapro_lang');
      if(saved && I18N[saved]) return saved;
    }catch(e){}
    const params = new URLSearchParams(window.location.search);
    const fromUrl = params.get('lang');
    if(fromUrl && I18N[fromUrl]) return fromUrl;
    const nav = (navigator.language || 'it').slice(0,2).toLowerCase();
    if(I18N[nav]) return nav;
    return 'it';
  }

  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    langMenu.classList.toggle('open');
    langBtn.setAttribute('aria-expanded', langMenu.classList.contains('open'));
  });
  document.addEventListener('click', () => langMenu.classList.remove('open'));

  setLang(detectDefaultLang());
</script>
